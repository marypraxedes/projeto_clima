<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>
<body class="light-side">
    <main class="container">
        <h1>Previsão do Tempo</h1>
        
        <!-- Botão para trocar de tema -->
        <button id="theme-toggle" class="theme-btn">
            Trocar Lado da Força ⚔️
        </button>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Qual planeta ou cidade?">
            <button id="search-btn">Buscar</button>
        </div>

        <div id="weather-result" class="hidden">
            <p id="current-date" class="date-text">--</p>
            <h2 id="city-name">--</h2>
            
            <div class="weather-display">
                <i id="weather-icon" class="wi wi-na"></i>
                <p class="temperature">
                    <span id="temperature-value">--</span>°C
                </p>
            </div>
            
            <p id="weather-description" class="description">--</p>
        </div>

        <div id="error-message" class="hidden">
            <p id="error-text">❌ Algo deu errado.</p>
        </div>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
