<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Previsão do Tempo ⛅</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Digite o nome da cidade (Ex: São Paulo)">
            <button id="search-btn">Buscar</button>
        </div>

        <!-- Container que exibirá o clima (escondido por padrão) -->
        <div id="weather-result" class="hidden">
            <h2 id="city-name">--</h2>
            <p class="temperature">
                <span id="temperature-value">--</span>°C
            </p>
            <p>Condição Atual</p>
        </div>

        <!-- Container de erro (escondido por padrão) -->
        <div id="error-message" class="hidden">
            <p>❌ Cidade não encontrada. Tente novamente.</p>
        </div>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
